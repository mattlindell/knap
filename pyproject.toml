[project]
name = "knap"
version = "0.2.0"
description = "Watch Obsidian web clippings and knap them into AI-summarized notes"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "requests",
    "watchdog",
    "yt-dlp",
    "jinja2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
knap = "clipping_watcher:main"
